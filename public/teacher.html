<!doctype html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OX Teacher</title><link rel="stylesheet" href="/style.css"></head><body><header><h1>🧑‍🏫 TEACHER CONTROL</h1><a href="/screen.html" target="_blank">전자칠판 열기 ↗</a></header><section id="auth" class="panel"><h2>관리자 PIN</h2><input id="pin" type="password" placeholder="TEACHER_PIN"><button id="unlock">로그인</button><p id="autherror"></p></section><main id="admin" hidden><section class="panel"><h2 id="summary">대기 중</h2><label>제한시간 <input type="number" id="seconds" value="15" min="5" max="60"> 초</label><div class="buttons"><button data-action="start">▶ 라운드 시작</button><button data-action="reveal">정답 공개</button><button data-action="next">다음 문제</button><button data-action="revive">전체 부활</button><button data-action="reset">처음부터</button><button data-action="clear_players" style="background:#ffb1b1;border-bottom-color:#b85252">학생 전체 퇴장</button></div></section><section class="panel"><h2>문제 등록</h2><p>한 줄에 문제 | O 또는 X | 해설</p><textarea id="questions" rows="10"></textarea><button id="save">문제 저장 및 게임 초기화</button></section></main><script src="/socket.io/socket.io.js"></script><script>const s=io();const $=x=>document.getElementById(x);$('unlock').onclick=()=>s.emit('auth',{pin:$('pin').value},r=>{if(r.error){$('autherror').textContent=r.error;return;}$('auth').hidden=true;$('admin').hidden=false;$('questions').value=r.questions.map(q=>[q.text,q.answer,q.explanation].join(' | ')).join('\n');});document.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>{if(b.dataset.action==='clear_players'&&!confirm('학생 전체를 입장 화면으로 돌려보낼까요? 등록한 문제는 유지됩니다.'))return;s.emit('teacher',{action:b.dataset.action,seconds:$('seconds').value});});$('save').onclick=()=>{const items=$('questions').value.split('\n').map(line=>{const [text,answer,explanation='']=line.split('|').map(x=>x.trim());return{text,answer,explanation};}).filter(q=>q.text&&['O','X'].includes(q.answer));if(!items.length)return alert('유효한 문제를 입력하세요.');s.emit('teacher',{action:'questions',items});alert(items.length+'문제 저장!');};s.on('state',v=>{$('summary').textContent=`${v.phase} · ROUND ${v.round+1} · 접속 ${v.players.filter(p=>p.connected).length}명 · 생존 ${v.players.filter(p=>p.alive).length}`;});</script></body></html>
