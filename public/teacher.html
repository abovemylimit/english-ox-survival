<!doctype html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OX Teacher</title><link rel="stylesheet" href="/style.css"></head><body>
<header><h1>🧑‍🏫 TEACHER CONTROL</h1><a href="/screen.html" target="_blank">전자칠판 열기 ↗</a><span id="connection" role="status"></span></header>
<section id="auth" class="panel"><h2>관리자 PIN</h2><input id="pin" type="password" placeholder="TEACHER_PIN"><button id="unlock">로그인</button><p id="autherror" role="status"></p></section>
<main id="admin" hidden>
<section class="panel"><h2>반 입장 관리</h2><p>학생에게 알려줄 입장코드</p><strong id="classcode" style="font-size:36px;letter-spacing:6px"></strong><h3 id="admission"></h3><p id="roomsummary"></p>
<div class="buttons"><button data-action="unlock">입장 열기</button><button data-action="lock">🔒 입장 마감</button><button data-action="new_class">새 반 시작</button><button data-action="clear_players" class="danger">학생 전체 퇴장</button></div>
<p>입장을 마감해도 등록한 학생은 같은 브라우저에서 복귀할 수 있습니다.</p>
<details><summary>참가자 관리 · 개별 퇴장 / 재입장코드</summary><p>다른 기기로 돌아온 학생은 명단의 ‘재입장코드’로 도와주세요. 10분 동안 한 번만 사용할 수 있습니다.</p><p id="recoveryinfo" role="status"></p><div class="roster-wrap"><table><thead><tr><th>닉네임</th><th>접속</th><th>상태</th><th>관리</th></tr></thead><tbody id="roster"></tbody></table></div></details><p id="notice" role="status"></p></section>
<section class="panel"><h2 id="summary">대기 중</h2><label>제한시간 <input type="number" id="seconds" value="15" min="5" max="60"> 초</label><div class="buttons"><button data-action="start">▶ 라운드 시작</button><button data-action="reveal">정답 공개</button><button data-action="next">다음 문제</button><button data-action="revive">전체 부활</button><button data-action="reset">처음부터</button></div></section>
<section class="panel"><h2>문제 등록</h2><p>한 줄에 문제 | O 또는 X | 해설</p><textarea id="questions" rows="10"></textarea><button id="save">문제 저장 및 게임 초기화</button><p>문제 저장·처음부터·새 반 시작은 등록한 문제를 유지합니다. 서버 재배포·재시작 시에는 다시 등록하세요.</p></section>
</main><script src="/socket.io/socket.io.js"></script><script src="/teacher.js"></script></body></html>
